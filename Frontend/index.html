<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Mini Militia TG</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:Arial;
background:
linear-gradient(
180deg,
#101820,
#1b2a41
);
}

/*
TOP BAR
*/
#topBar{
position:fixed;
top:0;
left:0;
width:100%;
height:65px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 15px;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(12px);

border-bottom:
1px solid rgba(255,255,255,0.08);

z-index:999;
}

/*
ROOM
*/
#roomCode{
color:white;
font-size:18px;
font-weight:bold;
}

/*
HEALTH
*/
#healthBox{
width:160px;
height:22px;
background:#222;
border-radius:12px;
overflow:hidden;
border:1px solid #555;
}

#health{
width:100%;
height:100%;

background:
linear-gradient(
90deg,
#00ff66,
#00cc55
);
}

/*
KILLS
*/
#kills{
color:white;
font-size:18px;
font-weight:bold;
}

/*
LEFT JOYSTICK
*/
#leftJoystick{
position:fixed;
left:20px;
bottom:20px;
width:150px;
height:150px;
z-index:999;
}

/*
RIGHT JOYSTICK
*/
#rightJoystick{
position:fixed;
right:20px;
bottom:20px;
width:150px;
height:150px;
z-index:999;
}

/*
SHOOT BUTTON
*/
#shootBtn{
position:fixed;

right:90px;
bottom:190px;

width:90px;
height:90px;

border:none;
border-radius:50%;

background:
linear-gradient(
180deg,
#ff6666,
#cc0000
);

box-shadow:
0 0 30px rgba(255,0,0,0.7);

color:white;

font-size:30px;

z-index:999;
}

canvas{
display:block;
}

</style>
</head>
<body>

<div id="topBar">

<div id="roomCode">
ROOM: GLOBAL
</div>

<div id="healthBox">
<div id="health"></div>
</div>

<div id="kills">
0 KILLS
</div>

</div>

<div id="leftJoystick"></div>

<div id="rightJoystick"></div>

<button id="shootBtn">
🔥
</button>

<script>

/*
TELEGRAM
*/
const tg =
window.Telegram.WebApp;

tg.expand();

/*
ROOM
*/
const params =
new URLSearchParams(
window.location.search
);

const ROOM_ID =
params.get("room") ||
"GLOBAL";

/*
SOCKET
*/
const socket = io();

/*
VARIABLES
*/
let player;

let bullets;

let otherPlayers = {};

let moveX = 0;
let moveY = 0;

let aimX = 1;
let aimY = 0;

/*
CONFIG
*/
const config = {

type:Phaser.AUTO,

width:window.innerWidth,

height:window.innerHeight,

backgroundColor:"#101820",

physics:{
default:"arcade",
arcade:{
gravity:{y:0},
debug:false
}
},

scene:{
preload,
create,
update
}

};

const game =
new Phaser.Game(config);

/*
PRELOAD
*/
function preload(){

/*
KENNEY STYLE ASSETS
*/
this.load.image(
"player",
"https://raw.githubusercontent.com/KenneyNL/Assets/master/PNG/Characters/character_robot.png"
);

this.load.image(
"bullet",
"https://labs.phaser.io/assets/sprites/bullets/bullet7.png"
);

this.load.image(
"bg",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1400"
);

}

/*
CREATE
*/
function create(){

/*
BACKGROUND
*/
this.add.image(
1500,
750,
"bg"
)
.setDisplaySize(
3000,
1500
);

/*
WORLD
*/
this.physics.world.setBounds(
0,
0,
3000,
1500
);

/*
PLAYER
*/
player =
this.physics.add.sprite(
500,
500,
"player"
);

player.setScale(1.4);

player.setCollideWorldBounds(true);

/*
BULLETS
*/
bullets =
this.physics.add.group();

/*
CAMERA
*/
this.cameras.main.startFollow(
player
);

this.cameras.main.setZoom(
1.15
);

this.cameras.main.setBounds(
0,
0,
3000,
1500
);

/*
JOIN ROOM
*/
socket.emit("joinRoom",{

room:ROOM_ID,

name:
tg.initDataUnsafe.user?.first_name
|| "Player"

});

/*
ROOM UI
*/
document.getElementById(
"roomCode"
).innerText =
"ROOM: " + ROOM_ID;

/*
LEFT JOYSTICK
*/
const leftJoystick =
nipplejs.create({

zone:
document.getElementById(
"leftJoystick"
),

mode:"static",

position:{
left:"75px",
top:"75px"
},

color:"white"

});

leftJoystick.on(
"move",
(evt,data)=>{

moveX = data.vector.x;
moveY = data.vector.y;

});

leftJoystick.on(
"end",
()=>{

moveX = 0;
moveY = 0;

});

/*
RIGHT JOYSTICK
*/
const rightJoystick =
nipplejs.create({

zone:
document.getElementById(
"rightJoystick"
),

mode:"static",

position:{
left:"75px",
top:"75px"
},

color:"red"

});

rightJoystick.on(
"move",
(evt,data)=>{

aimX = data.vector.x;
aimY = data.vector.y;

});

/*
SHOOT
*/
document.getElementById(
"shootBtn"
).onclick = ()=>{

shoot(this);

};

/*
PLAYERS
*/
socket.on(
"players",
(players)=>{

for(let id in players){

if(id === socket.id)
continue;

if(!otherPlayers[id]){

otherPlayers[id] =
this.physics.add.sprite(
players[id].x,
players[id].y,
"player"
);

otherPlayers[id].setScale(
1.4
);

}else{

otherPlayers[id].setPosition(
players[id].x,
players[id].y
);

otherPlayers[id].rotation =
players[id].rotation;

}

}

});

/*
REMOTE SHOOT
*/
socket.on(
"playerShoot",
(data)=>{

const bullet =
bullets.create(
data.x,
data.y,
"bullet"
);

this.physics.velocityFromRotation(
data.rotation,
900,
bullet.body.velocity
);

});

}

/*
SHOOT
*/
function shoot(scene){

const rotation =
Math.atan2(
aimY,
aimX
);

const bullet =
bullets.create(
player.x,
player.y,
"bullet"
);

scene.physics.velocityFromRotation(
rotation,
900,
bullet.body.velocity
);

/*
CAMERA SHAKE
*/
scene.cameras.main.shake(
80,
0.004
);

socket.emit(
"shoot",
{
x:player.x,
y:player.y,
rotation
}
);

}

/*
UPDATE
*/
function update(){

const speed = 320;

/*
MOVE
*/
player.setVelocityX(
moveX * speed
);

player.setVelocityY(
moveY * speed
);

/*
ROTATION
*/
player.rotation =
Math.atan2(
aimY,
aimX
);

/*
SEND POSITION
*/
socket.emit(
"move",
{
x:player.x,
y:player.y,
rotation:player.rotation
}
);

}

</script>

</body>
</html>
